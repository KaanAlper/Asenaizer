name: Installer

# Builds the setup programs and, with "publish", puts them on the fixed "setup" release, which is
# the repository's latest release (like Logical Lunge). The website links to
# releases/latest/download/Asenaizer-Setup-x64.exe. The setup programs download the newest
# v<semver> package themselves, so they only need rebuilding when the installer changes.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit (empty = main)"
        required: false
        default: ""
      publish:
        description: "Publish to the setup release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: setup (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            runner: windows-2022
          - target: linux
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || 'main' }}
      - name: Build the setup exe and its screenshots
        if: matrix.target == 'windows'
        shell: powershell
        run: |
          ./installer/gui/build.ps1 -Out dist -Shots
          (Get-FileHash dist/Asenaizer-Setup-x64.exe -Algorithm SHA256).Hash.ToLower() + '  Asenaizer-Setup-x64.exe' | Set-Content -NoNewline -Encoding ascii dist/Asenaizer-Setup-x64.exe.sha256
      - name: Build the Linux setup window
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libdbus-1-dev libxdo-dev
          cargo build --locked --release --manifest-path app/tray/Cargo.toml --bin asenaizer-setup
          mkdir -p dist && cp app/tray/target/release/asenaizer-setup dist/Asenaizer-Setup-linux-x64
          (cd dist && sha256sum Asenaizer-Setup-linux-x64 > Asenaizer-Setup-linux-x64.sha256)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: setup-${{ matrix.target }}
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/Asenaizer-Setup-*
            dist/shots/*.png

  publish:
    if: inputs.publish && (inputs.ref == '' || inputs.ref == 'main')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: out
          pattern: setup-*
          merge-multiple: true
      - name: Publish to the setup release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes=$'Download **Asenaizer-Setup-x64.exe** and run it. It installs the newest Asenaizer release for your Windows account (no administrator rights).\n\nOn Linux run:\n```\ncurl -fsSL https://raw.githubusercontent.com/KaanAlper/Asenaizer/main/scripts/install-linux.sh | bash\n```\nWith a desktop the same setup window opens; without one the steps run in the terminal.'
          if gh release view setup >/dev/null 2>&1; then
            gh release edit setup --notes "$notes" --latest
          else
            gh release create setup --title 'Asenaizer Setup' --notes "$notes" --target main --latest
          fi
          gh release upload setup out/Asenaizer-Setup-* --clobber
